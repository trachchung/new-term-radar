name = "seo-opportunity-workbench"
main = "./src/worker.js"
compatibility_date = "2026-10-13"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "seo-opportunity-radar"
database_id = "c6bd32b0-5508-48b1-a544-4578bf478d96"
migrations_dir = "./migrations"

[secrets]
required = ["ADMIN_TOKEN"]

[[services]]
binding = "COLLECTOR"
service = "seo-demand-collector"
