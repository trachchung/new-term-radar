name: Deploy to Cloudflare

# Builds the container image on this runner (Docker is preinstalled here, so nothing
# is built on a laptop) and deploys the Worker, the R2 bucket and the secrets.
#
# Needed repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with Workers, R2 and DNS edit rights on the account
#   CLOUDFLARE_ACCOUNT_ID  the account id shown in the Cloudflare dashboard
#   AISA_API_KEY           required by the radar
#   VIEW_TOKEN             bearer token that protects /report
# Optional: GOANYAPI_API_KEY, RESEND_API_KEY, EMAIL_FROM, RADAR_EMAIL_TO, GSC_TOKEN_JSON
#
# config.json must be committed (it is not secret; the Dockerfile copies it into the image).

on:
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "cloudflare/**"
      - "Dockerfile"
      - "requirements.txt"
      - "config.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check config.json is committed
        run: test -f config.json || { echo "config.json is missing from the repository"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler and the containers package
        working-directory: cloudflare
        run: npm install

      - name: Create the R2 state bucket (skipped if it exists)
        working-directory: cloudflare
        run: npx wrangler r2 bucket create new-term-radar-state || echo "bucket already exists or could not be created; deploy will tell"

      - name: Set the secrets that are provided
        working-directory: cloudflare
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          VIEW_TOKEN: ${{ secrets.VIEW_TOKEN }}
          GOANYAPI_API_KEY: ${{ secrets.GOANYAPI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
        run: |
          set -e
          for name in AISA_API_KEY VIEW_TOKEN GOANYAPI_API_KEY RESEND_API_KEY EMAIL_FROM RADAR_EMAIL_TO GSC_TOKEN_JSON; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "skip $name (not set)"
            fi
          done

      - name: Deploy the Worker and the container
        working-directory: cloudflare
        run: npx wrangler deploy

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://radar.9180.net/health; then echo; exit 0; fi
            sleep 10
          done
          echo "radar.9180.net did not answer /health"
          exit 1

      - name: Verify the report reader and R2 archive
        env:
          VIEW_TOKEN: ${{ secrets.VIEW_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          token = os.environ["VIEW_TOKEN"]
          headers = {"User-Agent": "new-term-radar-actions/1.0"}
          def get(path, auth=False):
              request = urllib.request.Request("https://radar.9180.net" + path, headers={**headers, **({"Authorization": "Bearer " + token} if auth else {})})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, b""
          status, page = get("/")
          assert status == 200 and "报告归档".encode() in page, "Reader page failed"
          assert get("/api/reports")[0] == 401, "Archive must require authentication"
          status, body = get("/api/reports", True)
          assert status == 200, "Authenticated archive failed"
          reports = json.loads(body)["reports"]
          for latest in reports[:2]:
              suffix = f"&batch={latest['batch']}" if latest.get("batch") else ""
              status, body = get(f"/api/report?date={latest['date']}&kind={latest['kind']}" + suffix, True)
              assert status == 200 and body, "Archived report failed"
              print(f"Archived report verified: {latest['date']}-{latest.get('batch', 0)}, {len(body)} bytes")
          print(f"Reader verified; {len(reports)} archived reports")
          PY
